name: Fork sync

on:
  schedule:
    # after the 03:45 UTC nightly tag; jrhubott/ha-apps checks edge and stable hourly and builds them
    - cron: "30 5 * * *"
    # picks up pushes to the listed feature branches, on the upstream commit edge already has
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: push nothing"
        type: boolean
        default: false
      target:
        description: "Branch to sync"
        type: choice
        options: [all, edge, stable]
        default: all
      features_only:
        description: "Edge: apply feature changes without taking newer upstream"
        type: boolean
        default: false

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  URLLIB3_NO_OVERRIDE: "1"

jobs:
  base-image:
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.pin.outputs.edge }}
      stable: ${{ steps.pin.outputs.stable }}
    steps:
      - id: pin
        # the base images upstream builds its nightly and its stable release on
        run: |
          pin() {
            v=$(curl -fsSL "https://raw.githubusercontent.com/music-assistant/server/$1/.github/workflows/release.yml" \
              | sed -n "s/^ *$2: *\"\([^\"]*\)\".*/\1/p")
            test -n "$v"
            echo "$3=$v" >> "$GITHUB_OUTPUT"
          }
          pin dev BASE_IMAGE_VERSION_NIGHTLY edge
          pin stable BASE_IMAGE_VERSION_STABLE stable

  sync:
    needs: base-image
    strategy:
      fail-fast: false
      matrix:
        # a scheduled run (no inputs) and "all" sync both branches
        target: ${{ fromJSON(github.event.schedule == '47 * * * *' && '["edge"]' || ((inputs.target == '' || inputs.target == 'all') && '["edge","stable"]' || format('["{0}"]', inputs.target))) }}
    name: sync (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: ghcr.io/music-assistant/base:${{ needs.base-image.outputs[matrix.target] }}
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git build-essential ca-certificates

      - name: Check out the sync script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Clone the fork
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          test -n "$SYNC_TOKEN" || { echo "::error::Add the SYNC_TOKEN repository secret"; exit 1; }
          git clone -q "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo remote add upstream https://github.com/music-assistant/server.git

      - name: Sync
        id: sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/fork_sync.py --config tools/fork-sync.json --repo-dir repo \
            --target ${{ matrix.target }} ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ (github.event.schedule == '47 * * * *' || inputs.features_only) && '--features-only' || '' }}
